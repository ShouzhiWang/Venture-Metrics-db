services:
  web-api:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: data-center-agent-web-api
    environment:
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/data_center_agent}
      DEMO_READ_DATABASE_URL: ${DEMO_READ_DATABASE_URL:-}
      STORAGE_ROOT: ${STORAGE_ROOT:-data}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEMO_LLM_PROVIDER: ${DEMO_LLM_PROVIDER:-mimo}
      DEMO_LLM_BASE_URL: ${DEMO_LLM_BASE_URL:-https://api.mimo-v2.com/v1}
      DEMO_LLM_MODEL: ${DEMO_LLM_MODEL:-mimo-v2.5}
      DEMO_LLM_API_KEY: ${DEMO_LLM_API_KEY:-}
      DEMO_LLM_TIMEOUT_SECONDS: ${DEMO_LLM_TIMEOUT_SECONDS:-30}
      DEMO_LLM_MAX_OUTPUT_TOKENS: ${DEMO_LLM_MAX_OUTPUT_TOKENS:-900}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-1209600}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      LOCAL_EMBEDDING_FALLBACK_MODEL: ${LOCAL_EMBEDDING_FALLBACK_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_MODEL_CACHE_DIR: ${EMBEDDING_MODEL_CACHE_DIR:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  web:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
    container_name: data-center-agent-web
    depends_on:
      web-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
