services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: data-center-agent-postgres
    environment:
      POSTGRES_DB: data_center_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_center_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
